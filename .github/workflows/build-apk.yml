name: Compilar APK Claude Code

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Criar Configuração do Capacitor
        run: |
          echo 'import { CapacitorConfig } from "@capacitor/cli";' > capacitor.config.ts
          echo 'const config: CapacitorConfig = {' >> capacitor.config.ts
          echo '  appId: "com.claude.code.mobile",' >> capacitor.config.ts
          echo '  appName: "Claude Code",' >> capacitor.config.ts
          echo '  webDir: "www"' >> capacitor.config.ts
          echo '};' >> capacitor.config.ts
          echo 'export default config;' >> capacitor.config.ts

      - name: Preparar Estrutura Web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Adicionar Plataforma Android
        run: |
          npx cap add android --force

      - name: Sincronizar Projeto
        run: |
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Code-Mobile.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
